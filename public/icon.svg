<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Base Plate / Background -->
  <rect width="512" height="512" rx="120" fill="#ffffff" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="#e2e8f0" stroke-width="6" />

  <!-- Metallic Roof Truss & Steel Structure -->
  <g filter="url(#glow)">
    <!-- Main Triangular Truss Top Chords -->
    <path d="M 64 380 L 256 100 L 448 380 Z" fill="none" stroke="url(#beamGrad)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Heavy Bottom Tie Beam (Tirante Inferior) -->
    <line x1="64" y1="380" x2="448" y2="380" stroke="url(#beamGrad)" stroke-width="30" stroke-linecap="round" />
    <line x1="84" y1="368" x2="428" y2="368" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Central King Post (Montante Central) -->
    <line x1="256" y1="100" x2="256" y2="380" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Internal Diagonal Struts (Diagonales Warren) -->
    <line x1="160" y1="240" x2="352" y2="240" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
    <line x1="160" y1="240" x2="256" y2="380" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <line x1="352" y1="240" x2="256" y2="380" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
    <line x1="64" y1="380" x2="160" y2="240" stroke="url(#beamGrad)" stroke-width="16" stroke-linecap="round" />
    <line x1="448" y1="380" x2="352" y2="240" stroke="url(#beamGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Connection Nodes & Steel Gusset Plates -->
    <circle cx="256" cy="100" r="22" fill="url(#goldGrad)" />
    <circle cx="256" cy="100" r="9" fill="#ffffff" />

    <circle cx="64" cy="380" r="20" fill="url(#beamGrad)" />
    <circle cx="64" cy="380" r="7" fill="#ffffff" opacity="0.9" />

    <circle cx="448" cy="380" r="20" fill="url(#beamGrad)" />
    <circle cx="448" cy="380" r="7" fill="#ffffff" opacity="0.9" />

    <circle cx="256" cy="380" r="22" fill="url(#goldGrad)" />
    <circle cx="256" cy="380" r="9" fill="#ffffff" />

    <circle cx="160" cy="240" r="16" fill="url(#accentGrad)" />
    <circle cx="160" cy="240" r="6" fill="#ffffff" opacity="0.9" />

    <circle cx="352" cy="240" r="16" fill="url(#accentGrad)" />
    <circle cx="352" cy="240" r="6" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
