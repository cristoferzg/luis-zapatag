<!doctype html><html><body style="margin:0;background:transparent"><canvas id="c" width="1400" height="1100"></canvas>
<script type="module">
// Visor de escenas para portadas: tubos (perfiles), cajas y polígonos (coberturas). Fondo transparente y sombras suaves.

</script></body></html>
